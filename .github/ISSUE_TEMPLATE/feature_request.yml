name: ✨ 功能建议 / Feature Request
description: 提议一个新功能或改进 / Propose a new feature or enhancement
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！清晰的动机描述能帮助我们判断优先级。
        Thanks for the suggestion! A clear motivation helps us prioritize.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: 提交前确认 / Prerequisites
      options:
        - label: 我已搜索过 [现有 Issue](https://github.com/antvis/G6Lite/issues)，确认没有重复 / I have searched existing issues and found no duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 这个功能解决了什么痛点？请描述使用场景。 / What problem does this solve? Describe the use case.
      placeholder: 当我想 ... 的时候，目前无法 ... / When I want to ..., I currently can't ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed Solution
      description: 你期望的 API 或行为是怎样的？ / What API or behavior do you expect?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
      description: 你考虑过的其他做法或现有 workaround。 / Other approaches or workarounds you have considered.

  - type: textarea
    id: context
    attributes:
      label: 补充信息 / Additional Context
      description: 截图、参考实现（如 G6 / sigma.js）、相关链接等。 / Screenshots, references (e.g. G6 / sigma.js), links.
