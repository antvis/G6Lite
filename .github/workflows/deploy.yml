name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://g6lite.antv.vision
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install library dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install site dependencies
        run: npm --prefix site install --no-package-lock --no-audit --no-fund

      - name: Build site
        run: npm run site

      - name: Create CNAME
        run: echo "g6lite.antv.vision" > site/out/CNAME

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site/out
          clean: true
