name: PR Playground Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Teardown on close
        if: github.event.action == 'closed'
        run: |
          DOMAIN="g6lite-pr-${{ github.event.pull_request.number }}.surge.sh"
          npx surge teardown "$DOMAIN" --token "$SURGE_TOKEN"
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}

      - uses: actions/checkout@v4
        if: github.event.action != 'closed'

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm install

      - name: Build playground
        if: github.event.action != 'closed'
        # vite.config.ts sets root:'playground'; --outDir is relative to that root
        run: npx vite build --outDir dist

      - name: Deploy to Surge
        if: github.event.action != 'closed'
        # Surge automatically posts the preview URL as a PR comment
        run: |
          DOMAIN="g6lite-pr-${{ github.event.pull_request.number }}.surge.sh"
          npx surge ./playground/dist "$DOMAIN" --token "$SURGE_TOKEN"
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
