<svg xmlns="http://www.w3.org/2000/svg" width="560" height="180" viewBox="0 0 560 180" fill="none">
  <title>status-node 根据 status 字段将普通节点显示为蓝色，错误节点显示为红色</title>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#94a3b8"/></marker></defs>
  <rect width="560" height="180" fill="#fff"/>
  <g font-family="system-ui, sans-serif" font-size="14" fill="#263445">
    <text x="24" y="28" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#475569">status: 'normal'</text>
    <text x="312" y="28" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#475569">status: 'error'</text>
    <rect x="66" y="66" width="140" height="50" rx="8" fill="#e6f4ff" stroke="#1677ff" />
    <rect x="354" y="66" width="140" height="50" rx="8" fill="#fff2f0" stroke="#ff4d4f" />
    <text x="136" y="97" text-anchor="middle" fill="#1677ff">正常节点</text>
    <text x="424" y="97" text-anchor="middle" fill="#d9363e">异常节点</text>
    <text x="24" y="156" font-size="12" fill="#718096">基于 rect，getStyle(node) 根据业务状态返回不同配色。</text>
  </g>
</svg>
