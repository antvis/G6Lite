# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    # 文件上传大小限制（最大200MB，支持视频上传）
    client_max_body_size 200m;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # aiweb 后端（Spring Boot 等），本机 7070
    upstream aiweb {
        server 127.0.0.1:7070;
    }

    # fuguo 后端，本机 6060
    upstream fuguo {
        server 127.0.0.1:6060;
    }

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    server {
        listen       80;
        listen       [::]:80;
        server_name  _;
        root         /usr/share/nginx/html;

        # 新增独立的图片资源处理配置
        location ^~ /images/ {
            alias /root/work/images/;  # 图片实际存储在 /root/work/images/ 目录下
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "https://zionchan.com" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;
            if ($request_method = 'OPTIONS') {
                return 204;
            }
            access_log /var/log/nginx/images-access.log main;
            error_log /var/log/nginx/images-error.log debug;
        }

        # 子路径 SPA：无尾斜杠时必须 301 到带 / 的目录 URL。
        # 构建产物若 publicPath 为 ./，浏览器以「当前文档目录」解析 ./umi.js；若 URL 为 /html/fuguo（无尾斜杠），
        # 相对路径会落到 /html/umi.js，资源错链 → 白屏。保留查询串：$is_args$args
        # agentb
        location = /html/agentb {
            return 301 /html/agentb/$is_args$args;
        }
        location ^~ /html/agentb/ {
            root /var/www;
            index index.html;
            try_files $uri $uri/ /html/agentb/index.html;
        }
        # agentb 静态资源（源码用绝对路径 /common/xx 引用）
        location ~ ^/(common|scripts|static|untils)/ {
            root /var/www/html/agentb;
        }

        location = /html/agentBUniapp {
            return 301 /html/agentBUniapp/$is_args$args;
        }
        location ^~ /html/agentBUniapp/ {
            root /var/www;
            index index.html;
            try_files $uri $uri/ /html/agentBUniapp/index.html;
        }
        location ~ ^/(assets|static)/ {
            root /var/www/html/agentBUniapp;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        # agentb 静态资源（源码用绝对路径 /common/xx 引用）
        # location ~ ^/(common|scripts|static|untils)/ {
        #     root /var/www/html/agentBUniapp;
        # }

        location = /html/beauty-web {
            return 301 /html/beauty-web/$is_args$args;
        }
        location = /html/yanuo {
            return 301 /html/yanuo/$is_args$args;
        }
        location = /html/tsingtai {
            return 301 /html/tsingtai/$is_args$args;
        }
        location = /html/fuguo {
            return 301 /html/fuguo/$is_args$args;
        }
        location = /html/exam {
            return 301 /html/exam/$is_args$args;
        }

        # ==================== SPA 应用（统一用 root /var/www） ====================
        # 目录结构：/var/www/html/{fuguo,yanuo,tsingtai,beauty-web,exam}/
        # URL 路径：/html/{fuguo,yanuo,tsingtai,beauty-web,exam}/
        # 用 root 而非 alias，避免 alias + try_files 路径拼接问题

        # beauty-web
        location = /html/beauty-web/index.html {
            root /var/www;
            add_header Cache-Control "no-cache";
        }
        location ^~ /html/beauty-web/ {
            root /var/www;
            index index.html;

            location ~* \.(js|mjs|css|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|json)$ {
                try_files $uri =404;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }

            try_files $uri $uri/ /html/beauty-web/index.html;
            access_log /var/log/nginx/beauty-web-access.log main;
            error_log /var/log/nginx/beauty-web-error.log debug;
        }

        # yanuo
        location = /html/yanuo/index.html {
            root /var/www;
            add_header Cache-Control "no-cache";
        }
        location ^~ /html/yanuo/ {
            root /var/www;
            index index.html;

            location ~* \.(js|mjs|css|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|json)$ {
                try_files $uri =404;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }

            try_files $uri $uri/ /html/yanuo/index.html;
            access_log /var/log/nginx/yanuo-access.log main;
            error_log /var/log/nginx/yanuo-error.log debug;
        }

        # tsingtai（清泰官网等，构建产物部署到 /var/www/html/tsingtai/）
        location = /html/tsingtai/index.html {
            root /var/www;
            add_header Cache-Control "no-cache";
        }
        location ^~ /html/tsingtai/ {
            root /var/www;
            index index.html;

            location ~* \.(js|mjs|css|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|json)$ {
                try_files $uri =404;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }

            try_files $uri $uri/ /html/tsingtai/index.html;
            access_log /var/log/nginx/tsingtai-access.log main;
            error_log /var/log/nginx/tsingtai-error.log debug;
        }

        # fuguo
        location = /html/fuguo/index.html {
            root /var/www;
            add_header Cache-Control "no-cache";
        }
        location ^~ /html/fuguo/ {
            root /var/www;
            index index.html;

            location ~* \.(js|mjs|css|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|json)$ {
                try_files $uri =404;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }

            try_files $uri $uri/ /html/fuguo/index.html;
            access_log /var/log/nginx/fuguo-access.log main;
            error_log /var/log/nginx/fuguo-error.log debug;
        }

        # exam
        location = /html/exam/index.html {
            root /var/www;
            add_header Cache-Control "no-cache";
        }
        location ^~ /html/exam/ {
            root /var/www;
            index index.html;

            location ~* \.(js|mjs|css|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|json)$ {
                try_files $uri =404;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }

            try_files $uri $uri/ /html/exam/index.html;
            access_log /var/log/nginx/exam-access.log main;
            error_log /var/log/nginx/exam-error.log debug;
        }


        # 视频静态资源
        location /videos/ {
            alias /root/work/videos/;
            add_header Cache-Control "public";
	    add_header Access-Control-Allow-Origin "https://zionchan.com" always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # fuguo API：/api/fuguo/ 前缀 → upstream fuguo（本机 6060）
        location ^~ /api/fuguo/ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With, token" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 3600 always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://fuguo;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # aiweb API：/api/aiweb/ 前缀 → upstream aiweb（本机 7070）
        location ^~ /api/aiweb/ {
            add_header Access-Control-Allow-Origin "https://zionchan.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With, token" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 3600 always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://aiweb;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

       # API 代理配置（其它 /api/ 仍走 8080）
        location /api/ {
            # CORS 跨域配置 - 允许 zionchan.com
            add_header Access-Control-Allow-Origin "https://zionchan.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 3600 always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }

            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;

        error_page 404 /404.html;
        location = /404.html {
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
        }
    }

