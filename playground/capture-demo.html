<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>G6Lite Demo Capture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: transparent; }
    #stage {
      width: 960px;
      height: 600px;
      position: relative;

  <div id="stage"></div>
  <script type="module" src="./capture-demo.ts"></script>
