<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G6Lite Playground</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #1a1a1a; color: #e0e0e0; }
    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #sidebar {
      width: 160px;
      flex-shrink: 0;
      background: #252525;
      padding: 12px 0;
      border-right: 1px solid #333;
    }
    .sidebar-title {
      padding: 8px 12px;
      font-size: 12px;
      color: #888;
      text-transform: uppercase;
    }
    .demo-link {
      display: block;
      padding: 8px 12px;
      color: #ccc;
      text-decoration: none;
      font-size: 14px;
      border-left: 3px solid transparent;
    }
    .demo-link:hover { color: #fff; background: #333; }
    .demo-link.active { color: #5B8FF9; border-left-color: #5B8FF9; background: #2a2a2a; }
    #graph-container {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #graph-container .canvas-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
  <div id="app">
    <nav id="sidebar"></nav>
    <main id="graph-container"></main>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
