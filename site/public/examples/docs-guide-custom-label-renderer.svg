<svg xmlns="http://www.w3.org/2000/svg" width="560" height="214" viewBox="0 0 560 214" fill="none">
  <title>自定义多行 Label Renderer 同时绘制节点标签与边标签的示意</title>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#94a3b8"/></marker></defs>
  <rect width="560" height="214" fill="#fff"/>
  <g font-family="system-ui, sans-serif" font-size="14" fill="#263445">
    <path d="M84 92L476 92" stroke="#99add1" stroke-width="2" />
    <rect x="234" y="67" width="92" height="46" rx="2" fill="#fff" stroke="#fff" />
    <text x="280" y="84" text-anchor="middle" font-size="12">HTTPS</text>
    <text x="280" y="103" text-anchor="middle" font-size="12">request</text>
    <circle cx="84" cy="92" r="16" fill="#1783ff" />
    <circle cx="476" cy="92" r="16" fill="#1783ff" />
    <text x="84" y="140" text-anchor="middle" font-size="12">Source Service</text>
    <text x="84" y="159" text-anchor="middle" font-size="12" fill="#718096">Shanghai</text>
    <text x="476" y="140" text-anchor="middle" font-size="12">Target Store</text>
    <text x="476" y="159" text-anchor="middle" font-size="12" fill="#718096">Hangzhou</text>
    <text x="24" y="198" font-size="12" fill="#718096">measure 测量完整内容，draw 绘制多行文本；定位由引擎负责。</text>
  </g>
</svg>
